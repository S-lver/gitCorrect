[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitcorrect"
version = "0.1.0"
description = "Autocorrect for git subcommands and flags."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "S-lver" }]
keywords = ["git", "cli", "autocorrect", "typo", "productivity"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
gitcorrect = "gitCorrect:main"

[project.urls]
Homepage = "https://github.com/S-lver/gitcorrect"